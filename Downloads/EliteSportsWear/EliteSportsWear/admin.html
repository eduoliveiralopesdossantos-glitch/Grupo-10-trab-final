<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | Elite Sports Wear</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body class="admin-page">
  <div class="page-shell admin-page">
    <header class="site-header admin-header">
      <div>
        <p class="eyebrow">Administração</p>
        <h1>Painel de Controle</h1>
      </div>
      <div class="admin-actions">
        <button id="logout-btn" type="button">Sair</button>
      </div>
    </header>

    <section class="panel">
      <div class="stats-grid">
        <div class="stat-card">
          <span id="total-products">0</span>
          <p>Produtos</p>
        </div>
        <div class="stat-card">
          <span id="total-users">0</span>
          <p>Contas</p>
        </div>
        <div class="stat-card">
          <span id="total-orders">0</span>
          <p>Pedidos</p>
        </div>
      </div>

      <div class="chart-card panel">
        <h2>Vendas recentes</h2>
        <canvas id="sales-chart"></canvas>
      </div>
    </section>

    <div class="admin-grid">
      <section class="panel">
        <h2>Gerenciar Produtos</h2>
        <form class="admin-form" id="product-form">
          <input type="hidden" id="product-id">
          <label>
            Nome do produto
            <input id="product-title" type="text" placeholder="Camiseta Carbon" required>
          </label>
          <label>
            Categoria
            <input id="product-label" type="text" placeholder="Treino" required>
          </label>
          <label>
            Descrição
            <textarea id="product-description" placeholder="Descrição do produto" required></textarea>
          </label>
          <label>
            Preço
            <input id="product-price" type="number" min="0" step="0.01" placeholder="129.90" required>
          </label>
          <label>
            URL da imagem
            <input id="product-image" type="text" placeholder="assets/images/product-1.jpg" required>
          </label>
          <label>
            Upload de imagem
            <input id="product-image-file" type="file" accept="image/*">
          </label>
          <div class="image-preview-card">
            <img id="product-image-preview" src="" alt="Prévia do produto">
          </div>
          <button type="submit">Salvar produto</button>
        </form>

        <table class="data-table" id="products-table">
          <thead>
            <tr>
              <th>Imagem</th>
              <th>Nome</th>
              <th>Preço</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="panel">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:18px;">
          <h2>Gerenciar Contas</h2>
          <span class="real-time-badge">Dados em tempo real</span>
        </div>
        <table class="data-table" id="users-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Role</th>
              <th>Criado em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <h2 style="margin-top: 32px;">Pedidos recentes</h2>
        <table class="data-table" id="orders-table">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Cliente</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </div>
  <script type="module" src="src/js/admin.js"></script>
</body>
</html>
